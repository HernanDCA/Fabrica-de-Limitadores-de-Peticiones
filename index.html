<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Limitador de Peticiones (Closures)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 550px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f8fafc;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #334155;
    }
    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }
    .btn-create { background-color: #2563eb; }
    .btn-create:hover { background-color: #1d4ed8; }
    .btn-action { background-color: #059669; }
    .btn-action:hover { background-color: #047857; }
    .btn-reset { background-color: #dc2626; }
    .btn-reset:hover { background-color: #b91c1c; }
    
    .estado-box {
      background: #f1f5f9;
      border-left: 4px solid #2563eb;
      padding: 12px;
      font-family: monospace;
      font-size: 1rem;
      margin-top: 10px;
    }
    ul.historial {
      list-style-type: none;
      padding: 0;
      max-height: 180px;
      overflow-y: auto;
    }
    ul.historial li {
      padding: 6px 10px;
      margin-bottom: 4px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.9rem;
      background: #f1f5f9;
    }
  </style>
</head>
<body>

  <!-- Configuración e Inicialización -->
  <div class="card">
    <h2>1. Configurar Controlador</h2>
    <div class="form-group">
      <label for="accion">Nombre de la Acción:</label>
      <input type="text" id="accion" value="Login">
    </div>
    <div class="form-group">
      <label for="maxIntentos">Límite Máximo de Intentos:</label>
      <input type="number" id="maxIntentos" min="1" value="3">
    </div>
    <button type="button" id="btnCrear" class="btn-create">Inicializar Instancia</button>
  </div>

  <!-- Panel de Ejecución de Peticiones -->
  <div class="card">
    <h2>2. Probar Peticiones</h2>
    <div class="btn-group">
      <button type="button" id="btnEjecutar" class="btn-action" disabled>Ejecutar Petición</button>
      <button type="button" id="btnReiniciar" class="btn-reset" disabled>Reiniciar Contador (true)</button>
    </div>

    <h3>Último Resultado:</h3>
    <div id="resultado" class="estado-box">Crea una instancia para comenzar...</div>

    <h3>Historial de Peticiones:</h3>
    <ul id="historial" class="historial"></ul>
  </div>

  <!-- Script independiente -->
  <script src="script.js"></script>
</body>
</html>
